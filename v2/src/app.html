<!doctype html>
<html lang="en" data-skin="modern" data-theme="ferrite">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!--
			Resolve all three display axes before the first paint. The attributes above are the
			defaults, so the page is correctly dressed with JavaScript off; this script only
			replaces them with the saved choice. The old site hardcoded a theme and applied the
			saved one after mount, so every non-default visitor saw a flash.

			The allowed values, the storage keys, and the defaults are duplicated from
			src/lib/appearance.svelte.ts. A pre-paint script cannot import. Change one, change
			the other.

			It also preloads the resolved skin's web font, because that is the only moment the
			skin is known and a static <link> is not. SKIN_FONT is duplicated from the @font-face
			block in app.css, and src/lib/tokens.test.ts fails if the two drift.
		-->
		<script>
			(() => {
				const pick = (key, allowed, fallback) => {
					try {
						const v = localStorage.getItem(key);
						return allowed.includes(v) ? v : fallback;
					} catch {
						return fallback;
					}
				};
				const el = document.documentElement;
				el.dataset.skin = pick('mnemos.skin', ['modern', 'retro', 'glass'], 'modern');
				el.dataset.theme = pick(
					'mnemos.theme',
					['ferrite', 'phosphor', 'halide', 'selenium'],
					'ferrite'
				);
				const appearance = pick('mnemos.appearance', ['light', 'dark', 'auto'], 'auto');
				const dark =
					appearance === 'auto'
						? matchMedia('(prefers-color-scheme: dark)').matches
						: appearance === 'dark';
				el.classList.toggle('dark', dark);

				// Skins absent from this map are on system stacks and need no request.
				const SKIN_FONT = { glass: '/fonts/montserrat-latin-var.woff2' };
				const href = SKIN_FONT[el.dataset.skin];
				if (href) {
					const link = document.createElement('link');
					link.rel = 'preload';
					link.as = 'font';
					link.type = 'font/woff2';
					// Required even same-origin: font fetches are always CORS-mode, so without
					// this the preload is discarded and the file is requested a second time.
					link.crossOrigin = 'anonymous';
					link.href = href;
					document.head.appendChild(link);
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
